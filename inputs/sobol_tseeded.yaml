# Configuration for Sobol sensitivity analysis with T_seeded

# Analysis settings
analysis_type: T_seeded
method: sobol


# Analysis-specific parameters
vector_length: 100      # default is 100
total_time: 315360000  # in seconds. default is 315360000 (10 years)

# Performance settings
n_jobs: null           # null for auto-detect, or specify number
chunk_size: null       # null for auto-calculate, or specify
batch_size: null    # null for auto-calculate, or specify
N_SAMPLES: 1000        # Number of samples for the Sobol analysis. Default is 1000
# Output settings
output_dir: outputs   #default is 'outputs'  
verbose: true
