# Parameter configuration for profiling tests
# Configuration with 10,000 combinations (10×5×5×4×10×1)

parameters:
  V_plasma_field:
    type: linear
    min: 150
    max: 1000
    points: 2
    unit: m^3
    description: Plasma volume
  
  T_i_field:
    type: scalar
    value: 14
    unit: keV
    description: Ion temperature
  
  n_tot_field:
    type: scalar
    value: 1.7e20
    unit: 1/m^3
    description: Total particle density
  
  tau_p_T_field:
    type: scalar
    value: 0.75
    unit: s
    description: Tritium particle confinement time
  
  tau_p_He3_field:
    type: scalar
    value: 1.0
    unit: s
    description: Helium-3 particle confinement time
  
  # P_aux_field:
  #   type: linear
  #   min: 50
  #   max: 80
  #   points: 1
  #   unit: MW
  #   description: Auxiliary heating power
  
  # P_aux_DT_eq_field:
  #   type: linear
  #   min: 50
  #   max: 80
  #   points: 1
  #   unit: MW
  #   description: Auxiliary power for DT equilibrium phase
  
  TBR_DT_field:
    type: scalar
    value: 1.1
    unit: dimensionless
    description: Tritium breeding ratio for DT reactions
  
  TBR_DDn_field:
    type: scalar
    value: 0.7
    unit: dimensionless
    description: Tritium breeding ratio for DD neutron branch
  
  tau_ifc_field:
    type: scalar
    value: 14400
    unit: s
    description: Inner-fuel cycle time 
  
  tau_ofc_field:
    type: scalar
    value: 7200
    unit: s
    description: Outer-of-fuel cycle time
  
  eta_th_field:
    type: scalar
    value: 0.35
    unit: dimensionless
    description: Thermal conversion efficiency
  
  capacity_factor_field:
    type: scalar
    value: 0.75
    unit: dimensionless
    description: Plant capacity factor
  
  price_of_electricity_field:
    type: scalar
    value : 0.25
    unit: 1/kWh
    description: Price of electricity (~0.22-0.27 $/kWh)
  
  I_target_field:
    type: scalar
    value: 1
    unit: kg
    description: Target tritium inventory
  
  max_simulation_time:
    value: 31536000
    unit: s
    description: Total simulation time (1 year in seconds)
  
# Total combinations: 10 × 5 × 5 × 4 × 10 × 1 = 10,000
