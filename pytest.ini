[pytest]
# Pytest configuration for dd_startup project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=ddstartup
    --cov-report=term-missing
    --cov-report=html
    --cov-config=.coveragerc

# Coverage will now run automatically with every pytest command
# - term-missing: Shows which lines are missing coverage in terminal
# - html: Generates detailed HTML report in htmlcov/
# To disable coverage for a single run: pytest --no-cov

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    physics: marks tests related to physics calculations
    postprocessing: marks tests related to postprocessing functions
    io: marks tests related to input/output operations

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.11

# Warning filters
filterwarnings =
    # Show all warnings (including external libraries)
    default::DeprecationWarning
    default::FutureWarning

# Console output format
console_output_style = progress

# Timeout (requires pytest-timeout)
# timeout = 300
